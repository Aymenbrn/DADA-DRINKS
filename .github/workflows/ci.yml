# Vérifie que le site compile (types TypeScript + build Next.js) à chaque push et pull request.
# Le déploiement lui-même est fait par Vercel, relié au dépôt : chaque push sur main part en production,
# chaque autre branche ou pull request obtient une préversion.
name: Vérification du build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Types TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build
